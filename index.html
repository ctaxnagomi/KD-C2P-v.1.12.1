    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap');
      
      :root {
        --bg: #050505;
        --card-bg: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --accent: #00CC00; /* Slightly darker neon green */
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        color: #e5e5e5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .mono { font-family: 'JetBrains+Mono', monospace; }
      .pixel { font-family: 'Press+Start+2P', cursive; }

      .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      .premium-gradient {
        background: linear-gradient(180deg, rgba(0, 204, 0, 0.02) 0%, rgba(255,255,255,0) 100%);
      }

      .text-gradient {
        background: linear-gradient(135deg, #ffffff 0%, #00CC00 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .kd-glow {
        filter: drop-shadow(0 0 8px rgba(0, 204, 0, 0.4));
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(0, 204, 0, 0.1);
        border-radius: 10px;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }

      .bmc-wrapper script { display: none !important; }
    </style>
